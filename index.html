<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #090e16;
  color: white;
  min-height: 100vh;
}

.topbar {
  padding: 22px 25px;
  font-size: 27px;
  font-weight: bold;
}

.main {
  max-width: 950px;
  margin: auto;
  padding: 20px 20px 80px;
  text-align: center;
}

.crown {
  font-size: 55px;
  margin-top: 10px;
}

h1 {
  font-size: 52px;
  margin-top: 8px;
}

.description {
  color: #9aa4b5;
  font-size: 20px;
  margin-top: 10px;
}

/* SEARCH */

.search-container {
  max-width: 750px;
  margin: 35px auto 0;
}

.search-box {
  display: flex;
  align-items: center;
  background: #121925;
  border: 1px solid #293545;
  border-radius: 20px;
  padding: 7px;
}

.search-icon {
  padding-left: 12px;
  font-size: 20px;
}

#searchInput {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 17px;
  padding: 14px;
}

#searchInput::placeholder {
  color: #7f8999;
}

#searchButton {
  border: none;
  background: #6577ff;
  color: white;
  border-radius: 14px;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

/* TABS */

.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.tab {
  background: #121925;
  color: #c0c8d5;
  border: 1px solid #293545;
  padding: 13px 20px;
  border-radius: 28px;
  font-size: 16px;
  cursor: pointer;
}

.tab.active {
  background: #202a42;
  border-color: #6577ff;
  color: white;
}

/* SUGGESTIONS */

.suggestions {
  margin-top: 28px;
}

.try-text {
  color: #8e98a8;
  margin-bottom: 15px;
  font-size: 17px;
}

.suggestion-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.suggestion {
  background: #121925;
  color: #c5cbd5;
  border: 1px solid #293545;
  border-radius: 22px;
  padding: 11px 17px;
  cursor: pointer;
}

/* RESULTS */

#results {
  max-width: 850px;
  margin: 35px auto;
  text-align: left;
}

.status {
  text-align: center;
  color: #8d98a8;
  padding: 30px;
}

.message-row {
  display: flex;
  margin-bottom: 18px;
}

.message {
  max-width: 85%;
  border-radius: 20px;
  padding: 20px;
  border: 1px solid #293545;
}

.user-message {
  margin-left: auto;
  background: #293550;
}

.ai-message {
  background: #141b27;
}

.message-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 12px;
}

.user-message .message-title {
  color: #ffffff;
}

.ai-message .message-title {
  color: #aeb9ff;
}

.message-text {
  color: #c8ced8;
  font-size: 17px;
  line-height: 1.7;
}

/* SEARCH RESULTS */

.result {
  background: #121925;
  border: 1px solid #293545;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 18px;
}

.result h2 {
  margin-bottom: 12px;
}

.result p {
  color: #c5cbd5;
  line-height: 1.7;
}

.source {
  display: inline-block;
  margin-top: 15px;
  color: #9ba6ff;
  text-decoration: none;
}

.new-chat {
  background: transparent;
  border: 1px solid #39455a;
  color: #bfc8d5;
  border-radius: 20px;
  padding: 10px 17px;
  margin-bottom: 20px;
  cursor: pointer;
}

/* MOBILE */

@media (max-width: 600px) {

  .topbar {
    font-size: 24px;
    padding: 18px;
  }

  .main {
    padding: 15px;
  }

  h1 {
    font-size: 43px;
  }

  .description {
    font-size: 18px;
  }

  #searchInput {
    font-size: 15px;
    padding: 12px 8px;
  }

  #searchButton {
    padding: 12px 14px;
  }

  .tab {
    padding: 12px 16px;
  }

  .message {
    max-width: 92%;
  }

}

</style>
</head>

<body>

<div class="topbar">
  👑 Factsack
</div>

<div class="main">

  <div class="crown">👑</div>

  <h1>Factsack</h1>

  <p class="description">
    Search. Ask. Discover.
  </p>


  <!-- SEARCH BAR -->

  <div class="search-container">

    <div class="search-box">

      <div class="search-icon">🔍</div>

      <input
        id="searchInput"
        type="text"
        placeholder="Search or ask anything..."
        autocomplete="off"
      >

      <button
        id="searchButton"
        onclick="searchFactsack()"
      >
        Search
      </button>

    </div>

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="selectMode('all', this)"
    >
      🔎 All
    </button>

    <button
      class="tab"
      onclick="selectMode('ai', this)"
    >
      🤖 AI Mode
    </button>

    <button
      class="tab"
      onclick="selectMode('images', this)"
    >
      🖼️ Images
    </button>

    <button
      class="tab"
      onclick="selectMode('news', this)"
    >
      📰 News
    </button>

    <button
      class="tab"
      onclick="selectMode('videos', this)"
    >
      🎥 Videos
    </button>

  </div>


  <!-- SUGGESTIONS -->

  <div
    class="suggestions"
    id="suggestions"
  >

    <div class="try-text">
      Try asking:
    </div>

    <div class="suggestion-buttons">

      <button
        class="suggestion"
        onclick="quickSearch('Hi')"
      >
        👋 Hi
      </button>

      <button
        class="suggestion"
        onclick="quickSearch('How are you?')"
      >
        😊 How are you?
      </button>

      <button
        class="suggestion"
        onclick="quickSearch('What should I eat today?')"
      >
        🍛 What should I eat?
      </button>

      <button
        class="suggestion"
        onclick="quickSearch('What is photosynthesis?')"
      >
        🌱 Photosynthesis
      </button>

    </div>

  </div>


  <!-- RESULTS -->

  <div id="results">

    <div class="status">
      Search Factsack to get started.
    </div>

  </div>

</div>


<script>

/* VARIABLES */

const input =
  document.getElementById("searchInput");

const results =
  document.getElementById("results");

const button =
  document.getElementById("searchButton");

const suggestions =
  document.getElementById("suggestions");

let currentMode = "all";


/* LOAD SAVED CHAT */

let chatHistory = [];

try {

  const savedChat =
    localStorage.getItem("factsackChat");

  if (savedChat) {

    chatHistory =
      JSON.parse(savedChat);

  }

} catch (error) {

  chatHistory = [];

}


/* ENTER KEY */

input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      searchFactsack();

    }

  }
);


/* SELECT MODE */

function selectMode(mode, element) {

  currentMode = mode;

  document
    .querySelectorAll(".tab")
    .forEach(function(tab) {

      tab.classList.remove("active");

    });

  element.classList.add("active");


  if (mode === "ai") {

    input.placeholder =
      "Message Factsack AI...";

    button.textContent =
      "Ask";

    suggestions.style.display =
      "block";

    showChat();


  } else {

    input.placeholder =
      "Search Factsack...";

    button.textContent =
      "Search";

    suggestions.style.display =
      "block";

    results.innerHTML =
      '<div class="status">Search Factsack to get started.</div>';

  }

}


/* QUICK SEARCH */

function quickSearch(query) {

  input.value = query;

  currentMode = "ai";

  document
    .querySelectorAll(".tab")
    .forEach(function(tab) {

      tab.classList.remove("active");

    });

  document
    .querySelectorAll(".tab")[1]
    .classList.add("active");

  input.placeholder =
    "Message Factsack AI...";

  button.textContent =
    "Ask";

  searchFactsack();

}


/* MAIN SEARCH */

function searchFactsack() {

  const query =
    input.value.trim();

  if (!query) return;


  if (currentMode === "ai") {

    aiMode(query);

    input.value = "";

    return;

  }


  if (currentMode === "all") {

    normalSearch(query);

    return;

  }


  results.innerHTML =
    '<div class="status">This feature is coming soon.</div>';

}


/* SAVE CHAT */

function saveChat() {

  localStorage.setItem(
    "factsackChat",
    JSON.stringify(chatHistory)
  );

}


/* SHOW CHAT */

function showChat() {

  results.innerHTML =
    '<button class="new-chat" onclick="clearChat()">＋ New Chat</button>';


  if (chatHistory.length === 0) {

    results.innerHTML += `

      <div class="message-row">

        <div class="message ai-message">

          <div class="message-title">
            🤖 Factsack AI
          </div>

          <div class="message-text">
            Hey! 👋 What's up? You can chat with me or ask me anything.
          </div>

        </div>

      </div>

    `;

  }


  chatHistory.forEach(function(message) {

    addMessageToScreen(
      message.sender,
      message.text
    );

  });


  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}


/* ADD MESSAGE */

function addMessageToScreen(sender, text) {

  const row =
    document.createElement("div");

  row.className =
    "message-row";


  const box =
    document.createElement("div");


  if (sender === "user") {

    box.className =
      "message user-message";


    box.innerHTML = `

      <div class="message-title">
        You
      </div>

      <div class="message-text">
        ${escapeHTML(text)}
      </div>

    `;

  }


  else {

    box.className =
      "message ai-message";


    box.innerHTML = `

      <div class="message-title">
        🤖 Factsack AI
      </div>

      <div class="message-text">
        ${escapeHTML(text)}
      </div>

    `;

  }


  row.appendChild(box);

  results.appendChild(row);


}


/* AI MODE */

async function aiMode(query) {


  suggestions.style.display =
    "none";


  if (
    results.innerHTML.includes("Search Factsack")
  ) {

    results.innerHTML =
      '<button class="new-chat" onclick="clearChat()">＋ New Chat</button>';

  }


  chatHistory.push({

    sender: "user",

    text: query

  });


  saveChat();


  addMessageToScreen(
    "user",
    query
  );


  const thinking =
    document.createElement("div");

  thinking.className =
    "message-row";


  thinking.innerHTML = `

    <div class="message ai-message">

      <div class="message-title">
        🤖 Factsack AI
      </div>

      <div class="message-text">
        Thinking...
      </div>

    </div>

  `;


  results.appendChild(thinking);


  window.scrollTo(
    0,
    document.body.scrollHeight
  );


  const question =
    query.toLowerCase().trim();


  let answer = "";


  /* GREETINGS */

  if (

    question === "hi" ||
    question === "hello" ||
    question === "hey" ||
    question === "yo"

  ) {

    answer =
      "Hey! 👋 What's up? How are you doing?";

  }


  /* HOW ARE YOU */

  else if (

    question === "how are you" ||
    question === "how are you?" ||
    question === "how r u" ||
    question === "hw r u" ||
    question === "how are u"

  ) {

    answer =
      "I'm doing great! 😄 Thanks for asking. How are you doing today?";

  }


  /* WSP */

  else if (

    question === "wsp" ||
    question === "wassup" ||
    question === "what's up" ||
    question === "whats up"

  ) {

    answer =
      "Not much 😄 I'm just here chilling and ready to talk with you! What's up with you?";

  }


  /* USER IS GOOD */

  else if (

    question === "i'm good" ||
    question === "im good" ||
    question === "i am good"

  ) {

    answer =
      "That's great! 😄 Glad to hear that. So what are you up to today?";

  }


  /* TALK ABOUT SOMETHING ELSE */

  else if (

    question.includes("talk about something else") ||
    question.includes("something else")

  ) {

    answer =
      "Sure 😄 We can talk about anything! Music, movies, games, food, school, technology, or even ideas for Factsack. What are you interested in right now?";

  }


  /* FOOD */

  else if (

    question.includes("what should i eat") ||
    question.includes("what can i eat") ||
    question.includes("what do you prefer for me to eat")

  ) {

    answer =
      "Hmm 😋 I'd suggest waakye, jollof rice, fried rice, or rice and chicken! What are you in the mood for: something light, spicy, or filling?";

  }


  /* BORED */

  else if (

    question.includes("i'm bored") ||
    question.includes("im bored") ||
    question === "bored"

  ) {

    answer =
      "😂 Let's fix that! We can play a quiz, talk about something interesting, brainstorm a new Factsack feature, or I can give you a challenge. What sounds fun?";

  }


  /* CREATOR */

  else if (

    question.includes("who created you") ||
    question.includes("who made you") ||
    question.includes("who created u") ||
    question.includes("who made u") ||
    question.includes("your creator")

  ) {

    answer =
      "I was created by Desmond Nana Osei, a JHS graduate and developer. 👑";

  }


  /* NAME */

  else if (

    question.includes("what is your name") ||
    question.includes("what's your name") ||
    question === "who are you"

  ) {

    answer =
      "I'm Factsack AI 🤖! I'm part of the Factsack search engine. You can chat with me or ask me questions.";

  }


  /* THANKS */

  else if (

    question === "thanks" ||
    question === "thank you" ||
    question === "tnx" ||
    question === "thx"

  ) {

    answer =
      "You're welcome! 😄 Anytime!";

  }


  /* BYE */

  else if (

    question === "bye" ||
    question === "goodbye" ||
    question === "see you"

  ) {

    answer =
      "Bye! 👋 Take care and come back anytime!";

  }


  /* WHAT ARE YOU DOING */

  else if (

    question.includes("what are you doing") ||
    question.includes("what r u doing") ||
    question.includes("wat are u doing")

  ) {

    answer =
      "Right now I'm here talking with you 😄 and ready to answer anything you want!";

  }


  /* FACTUAL QUESTION */

  else {

    try {

      thinking.querySelector(".message-text").textContent =
        "Finding your answer...";


      const searchURL =

        "https://en.wikipedia.org/w/api.php" +

        "?action=query" +

        "&list=search" +

        "&srsearch=" +

        encodeURIComponent(query) +

        "&srlimit=1" +

        "&format=json" +

        "&origin=*";


      const response =
        await fetch(searchURL);


      const data =
        await response.json();


      if (

        data.query &&
        data.query.search &&
        data.query.search.length > 0

      ) {

        const title =
          data.query.search[0].title;


        const summaryURL =

          "https://en.wikipedia.org/api/rest_v1/page/summary/" +

          encodeURIComponent(title);


        const summaryResponse =
          await fetch(summaryURL);


        const summaryData =
          await summaryResponse.json();


        answer =
          summaryData.extract ||
          "I couldn't find a clear answer for that.";

      }


      else {

        answer =
          "Hmm, I couldn't find an answer for that. Try asking me another way 😄";

      }


    }


    catch (error) {

      answer =
        "I couldn't find an answer right now. Check your internet connection and try again.";

    }

  }


  thinking.remove();


  chatHistory.push({

    sender: "ai",

    text: answer

  });


  saveChat();


  addMessageToScreen(
    "ai",
    answer
  );


  window.scrollTo(
    0,
    document.body.scrollHeight
  );


}


/* CLEAR CHAT */

function clearChat() {

  chatHistory = [];

  localStorage.removeItem(
    "factsackChat"
  );


  showChat();

}


/* NORMAL SEARCH */

async function normalSearch(query) {

  results.innerHTML =
    '<div class="status">🔎 Searching Factsack...</div>';


  try {

    const url =

      "https://en.wikipedia.org/w/api.php" +

      "?action=query" +

      "&generator=search" +

      "&gsrsearch=" +

      encodeURIComponent(query) +

      "&gsrnamespace=0" +

      "&gsrlimit=8" +

      "&prop=extracts|info" +

      "&exintro=true" +

      "&explaintext=true" +

      "&inprop=url" +

      "&format=json" +

      "&origin=*";


    const response =
      await fetch(url);


    const data =
      await response.json();


    if (

      !data.query ||
      !data.query.pages

    ) {

      results.innerHTML =
        '<div class="status">No results found.</div>';

      return;

    }


    const pages =
      Object.values(data.query.pages);


    results.innerHTML = "";


    pages.forEach(function(page) {

      const card =
        document.createElement("div");


      card.className =
        "result";


      let text =
        page.extract ||
        "No description available.";


      if (text.length > 400) {

        text =
          text.substring(0, 400) + "...";

      }


      card.innerHTML = `

        <h2>
          ${escapeHTML(page.title)}
        </h2>

        <p>
          ${escapeHTML(text)}
        </p>

        <a
          class="source"
          href="${page.fullurl}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Read more ↗
        </a>

      `;


      results.appendChild(card);
