<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d16;
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

/* BACKGROUND */

body::before {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: rgba(20, 100, 255, 0.15);
  filter: blur(100px);
  top: -250px;
  left: -200px;
  z-index: -1;
}

body::after {
  content: "";
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: rgba(20, 100, 255, 0.12);
  filter: blur(100px);
  bottom: -250px;
  right: -200px;
  z-index: -1;
}

/* HEADER */

header {
  padding: 25px;
  display: flex;
  justify-content: flex-end;
}

/* DARK MODE BUTTON */

.dark-btn {
  width: 50px;
  height: 50px;
  border: none;
  border-radius: 50%;
  background: #111a2b;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

/* MAIN */

main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* LOGO */

.logo-area {
  text-align: center;
  margin-top: 20px;
}

.logo {
  position: relative;
  display: inline-block;
  font-size: 64px;
  font-weight: bold;
  letter-spacing: -3px;
  color: white;
  text-shadow: 0 0 25px rgba(50, 120, 255, 0.4);
}

/* CROWN */

.crown {
  position: absolute;
  top: -45px;
  left: 5px;
  font-size: 45px;
  transform: rotate(-15deg);
}

.subtitle {
  margin-top: 20px;
  color: #9fb3d9;
  font-size: 20px;
  letter-spacing: 3px;
}

/* SEARCH */

.search-box {
  margin-top: 60px;
  display: flex;
  border: 2px solid #2979ff;
  border-radius: 35px;
  overflow: hidden;
  background: #101827;
  box-shadow: 0 0 25px rgba(41, 121, 255, 0.2);
}

.search-box input {
  flex: 1;
  border: none;
  outline: none;
  padding: 20px;
  font-size: 18px;
  background: transparent;
  color: white;
}

.search-box input::placeholder {
  color: #8290aa;
}

.search-btn {
  border: none;
  padding: 0 35px;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* QUICK SEARCHES */

.quick-searches {
  margin-top: 35px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
}

.quick-searches button {
  background: #111a2b;
  color: white;
  border: 1px solid #29466f;
  padding: 15px 25px;
  border-radius: 30px;
  font-size: 17px;
  cursor: pointer;
  transition: 0.2s;
}

.quick-searches button:hover {
  background: #1d2b44;
  border-color: #3b82f6;
}

/* ANSWER */

.answer-box {
  margin-top: 55px;
  padding: 35px;
  border-radius: 25px;
  background: linear-gradient(
    145deg,
    #111c30,
    #0c1423
  );
  border: 1px solid #245ca8;
  box-shadow: 0 0 30px rgba(30, 100, 255, 0.15);
  text-align: left;
}

.answer-box h2 {
  margin-top: 0;
  font-size: 32px;
  color: #61a0ff;
}

.answer-box p {
  font-size: 20px;
  line-height: 1.8;
  color: #d7e1f3;
}

/* LOADING */

.loading {
  margin-top: 50px;
  text-align: center;
  font-size: 20px;
  color: #9fb3d9;
}

/* ERROR */

.error {
  margin-top: 50px;
  text-align: center;
  color: #ff7777;
  font-size: 18px;
}

/* FOOTER */

footer {
  margin-top: 70px;
  padding: 35px;
  text-align: center;
  color: #71809a;
  font-size: 17px;
}

/* LIGHT MODE */

body.light {
  background: #f4f7fc;
  color: #111;
}

body.light::before,
body.light::after {
  opacity: 0.4;
}

body.light .search-box {
  background: white;
}

body.light .search-box input {
  color: #111;
}

body.light .quick-searches button {
  background: white;
  color: #111;
}

body.light .answer-box {
  background: white;
}

body.light .answer-box p {
  color: #333;
}

body.light .dark-btn {
  background: white;
  color: #111;
}

/* MOBILE */

@media (max-width: 600px) {

  .logo {
    font-size: 52px;
  }

  .crown {
    font-size: 35px;
    top: -35px;
  }

  .subtitle {
    font-size: 15px;
    letter-spacing: 2px;
  }

  .search-box {
    margin-top: 45px;
  }

  .search-box input {
    padding: 17px;
    width: 100%;
  }

  .search-btn {
    padding: 0 20px;
  }

  .answer-box {
    padding: 25px;
  }

  .answer-box h2 {
    font-size: 26px;
  }

  .answer-box p {
    font-size: 18px;
  }

}

</style>
</head>

<body>

<header>

<button
class="dark-btn"
onclick="toggleTheme()"
id="themeButton"
>
☀️
</button>

</header>


<main>


<div class="logo-area">

<div class="logo">

<span class="crown">
👑
</span>

Factsack

</div>


<div class="subtitle">
SEARCH. DISCOVER. LEARN.
</div>

</div>
