<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Factsack 2.0</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b10;
      color: #ffffff;
      min-height: 100vh;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 22px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo span {
      font-size: 24px;
    }

    .version {
      color: #8993a3;
      font-size: 13px;
    }

    /* HERO */

    .hero {
      text-align: center;
      padding: 80px 20px 40px;
    }

    .hero-logo {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero h1 {
      font-size: 48px;
      letter-spacing: -2px;
      margin-bottom: 12px;
    }

    .hero h1 span {
      font-weight: 400;
    }

    .hero p {
      color: #8993a3;
      font-size: 16px;
      margin-bottom: 35px;
    }

    /* SEARCH */

    .search-wrapper {
      width: 100%;
      max-width: 720px;
      margin: auto;
      position: relative;
    }

    .search-box {
      width: 100%;
      height: 62px;
      background: #11161e;
      border: 1px solid #293241;
      border-radius: 17px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 20px;
      transition: 0.2s;
    }

    .search-box:focus-within {
      border-color: #6577ff;
      box-shadow: 0 0 0 3px rgba(101, 119, 255, 0.08);
    }

    .search-icon {
      font-size: 20px;
      margin-right: 12px;
      color: #7d8797;
    }

    #searchBox {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 16px;
    }

    #searchBox::placeholder {
      color: #687384;
    }

    #searchButton {
      height: 48px;
      padding: 0 22px;
      border: none;
      border-radius: 12px;
      background: #6577ff;
      color: white;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }

    #searchButton:hover {
      opacity: 0.9;
    }

    /* SUGGESTIONS */

    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .suggestion {
      background: #11161e;
      border: 1px solid #293241;
      color: #aeb7c5;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
    }

    .suggestion:hover {
      color: white;
      border-color: #6577ff;
    }

    /* RESULTS */

    #results {
      width: 92%;
      max-width: 800px;
      margin: 30px auto 70px;
    }

    .results-title {
      color: #8993a3;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .result {
      background: #11161e;
      border: 1px solid #293241;
      border-radius: 15px;
      padding: 22px;
      margin-bottom: 14px;
    }

    .result h2 {
      font-size: 20px;
      margin-bottom: 9px;
    }

    .result p {
      color: #c5ccd7;
      line-height: 1.65;
      font-size: 15px;
    }

    .source {
      display: inline-block;
      margin-top: 14px;
      color: #8291ff;
      text-decoration: none;
      font-size: 14px;
    }

    .source:hover {
      text-decoration: underline;
    }

    .status {
      text-align: center;
      color: #697586;
      padding: 35px 10px;
    }

    /* FOOTER */

    footer {
      text-align: center;
      color: #4f5968;
      font-size: 12px;
      padding: 20px;
      border-top: 1px solid #151b24;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        padding: 18px;
      }

      .hero {
        padding: 55px 18px 30px;
      }

      .hero-logo {
        font-size: 45px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .search-box {
        height: auto;
        min-height: 58px;
      }

      #searchButton {
        padding: 0 15px;
      }

      .version {
        display: none;
      }
    }

    @media (max-width: 430px) {

      .search-box {
        padding-left: 14px;
      }

      .search-icon {
        display: none;
      }

      #searchButton {
        height: 44px;
        padding: 0 13px;
      }

      #searchBox {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">
      👑 Factsack
    </div>

    <div class="version">
      Factsack 2.0
    </div>

  </header>


  <!-- HERO -->

  <main>

    <section class="hero">

      <div class="hero-logo">
        👑
      </div>

      <h1>
        Factsack <span>2.0</span>
      </h1>

      <p>
        Search the web. Discover the facts.
      </p>


      <!-- SEARCH -->

      <div class="search-wrapper">

        <div class="search-box">

          <div class="search-icon">
            🔎
          </div>

          <input
            id="searchBox"
            type="text"
            placeholder="Search for anything..."
            autocomplete="off"
          >

          <button id="searchButton">
            Search
          </button>

        </div>


        <!-- SUGGESTIONS -->

        <div class="suggestions">

          <div
            class="suggestion"
            onclick="quickSearch('Ghana')"
          >
            🇬🇭 Ghana
          </div>

          <div
            class="suggestion"
            onclick="quickSearch('Africa')"
          >
            🌍 Africa
          </div>

          <div
            class="suggestion"
            onclick="quickSearch('Space')"
          >
            🚀 Space
          </div>

          <div
            class="suggestion"
            onclick="quickSearch('Albert Einstein')"
          >
            🧠 Einstein
          </div>

          <div
            class="suggestion"
            onclick="quickSearch('Technology')"
          >
            💻 Technology
          </div>

        </div>

      </div>

    </section>


    <!-- RESULTS -->

    <section id="results">

      <div class="status">
        Search Factsack to get started.
      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>
    Factsack 2.0 • Search and discover
  </footer>


  <script>

    const searchBox =
      document.getElementById("searchBox");

    const searchButton =
      document.getElementById("searchButton");

    const results =
      document.getElementById("results");


    /* SEARCH BUTTON */

    searchButton.addEventListener(
      "click",
      searchWeb
    );


    /* ENTER KEY */

    searchBox.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          searchWeb();
        }

      }
    );


    /* QUICK SEARCH */

    function quickSearch(query) {

      searchBox.value = query;

      searchWeb();

    }


    /* MAIN SEARCH */

    async function searchWeb() {

      const query =
        searchBox.value.trim();


      if (!query) {

        results.innerHTML = `
          <div class="status">
            Type something to search.
          </div>
        `;

        return;

      }


      results.innerHTML = `
        <div class="status">
          🔎 Searching Factsack...
        </div>
      `;


      try {

        const url =
          "https://en.wikipedia.org/w/api.php" +
          "?action=query" +
          "&generator=search" +
          "&gsrsearch=" +
          encodeURIComponent(query) +
          "&gsrnamespace=0" +
          "&gsrlimit=8" +
          "&prop=extracts|info" +
          "&exintro=true" +
          "&explaintext=true" +
          "&inprop=url" +
          "&format=json" +
          "&origin=*";


        const response =
          await fetch(url);


        if (!response.ok) {
          throw new Error(
            "Search request failed"
          );
        }


        const data =
          await response.json();


        if (
          !data.query ||
          !data.query.pages
        ) {

          results.innerHTML = `
            <div class="result">

              <h2>No results found</h2>

              <p>
                Factsack couldn't find
                information about
                "<strong>${escapeHTML(query)}</strong>".
              </p>

            </div>
          `;

          return;

        }


        const pages =
          Object.values(
            data.query.pages
          );


        results.innerHTML = `
          <div class="results-title">
            Results for "${escapeHTML(query)}"
          </div>
        `;


        pages.forEach(page => {

          const title =
            page.title || "Untitled";


          let extract =
            page.extract ||
            "No description is available.";


          if (extract.length > 550) {

            extract =
              extract.substring(0, 550) +
              "...";

          }


          const articleURL =
            page.fullurl ||
            "https://en.wikipedia.org/wiki/" +
            encodeURIComponent(
              title.replace(/ /g, "_")
            );


          const card =
            document.createElement("div");


          card.className = "result";


          card.innerHTML = `

            <h2>
              ${escapeHTML(title)}
            </h2>

            <p>
              ${escapeHTML(extract)}
            </p>

            <a
              class="source"
              href="${articleURL}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Read source ↗
            </a>

          `;


          results.appendChild(card);

        });


      } catch (error) {

        results.innerHTML = `

          <div class="result">

            <h2>
              Connection problem
            </h2>

            <p>
              Factsack couldn't connect
              to the search service.
              Please check your internet
              connection and try again.
            </p>

          </div>

        `;

      }

    }


    /* SECURITY */

    function escapeHTML(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
</html>
