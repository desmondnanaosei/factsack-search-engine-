<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Factsack Search Engine</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0f14;
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 35px 20px 10px;
    }

    .logo {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: -1px;
    }

    .logo span {
      font-size: 34px;
    }

    .tagline {
      color: #8b95a5;
      margin-top: 8px;
      font-size: 14px;
    }

    .search-container {
      width: 92%;
      max-width: 750px;
      margin: 40px auto 30px;
      display: flex;
      gap: 10px;
    }

    #searchBox {
      flex: 1;
      background: #111821;
      border: 1px solid #273342;
      color: white;
      padding: 17px 20px;
      border-radius: 14px;
      outline: none;
      font-size: 16px;
    }

    #searchBox:focus {
      border-color: #667eea;
    }

    #searchButton {
      border: none;
      background: #667eea;
      color: white;
      padding: 0 25px;
      border-radius: 14px;
      font-size: 16px;
      cursor: pointer;
    }

    #searchButton:hover {
      opacity: 0.9;
    }

    #results {
      width: 92%;
      max-width: 750px;
      margin: auto;
    }

    .status {
      text-align: center;
      color: #7d8795;
      margin-top: 45px;
    }

    .result {
      background: #111821;
      border: 1px solid #273342;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
    }

    .result h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .result p {
      color: #c8d0da;
      line-height: 1.65;
      font-size: 15px;
    }

    .source {
      display: inline-block;
      margin-top: 15px;
      color: #8295ff;
      text-decoration: none;
      font-size: 14px;
    }

    .source:hover {
      text-decoration: underline;
    }

    .loading {
      text-align: center;
      color: #9aa4b2;
      margin-top: 45px;
    }

    @media (max-width: 600px) {
      .search-container {
        flex-direction: column;
      }

      #searchButton {
        height: 52px;
      }

      .logo {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      👑 Factsack
    </div>

    <div class="tagline">
      Search the web. Discover the facts.
    </div>
  </header>


  <div class="search-container">

    <input
      id="searchBox"
      type="text"
      placeholder="Search for anything..."
      autocomplete="off"
    >

    <button id="searchButton">
      Search
    </button>

  </div>


  <div id="results">
    <div class="status">
      Search Factsack for an answer.
    </div>
  </div>


  <script>

    const searchBox = document.getElementById("searchBox");
    const searchButton = document.getElementById("searchButton");
    const results = document.getElementById("results");


    searchButton.addEventListener("click", searchWeb);


    searchBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        searchWeb();
      }
    });


    async function searchWeb() {

      const query = searchBox.value.trim();

      if (!query) {
        results.innerHTML = `
          <div class="status">
            Type something to search.
          </div>
        `;
        return;
      }


      results.innerHTML = `
        <div class="loading">
          🔎 Searching Factsack...
        </div>
      `;


      try {

        const url =
          "https://en.wikipedia.org/w/api.php" +
          "?action=query" +
          "&generator=search" +
          "&gsrsearch=" + encodeURIComponent(query) +
          "&gsrnamespace=0" +
          "&gsrlimit=8" +
          "&prop=extracts|info" +
          "&exintro=true" +
          "&explaintext=true" +
          "&inprop=url" +
          "&format=json" +
          "&origin=*";


        const response = await fetch(url);


        if (!response.ok) {
          throw new Error("Search request failed");
        }


        const data = await response.json();


        if (!data.query || !data.query.pages) {

          results.innerHTML = `
            <div class="result">
              <h2>No results found</h2>
              <p>
                Factsack couldn't find an answer for
                "<strong>${escapeHTML(query)}</strong>".
              </p>
            </div>
          `;

          return;
        }


        const pages = Object.values(data.query.pages);


        results.innerHTML = "";


        pages.forEach(page => {

          const title = page.title || "Untitled";

          let extract =
            page.extract ||
            "No description is available for this result.";


          if (extract.length > 500) {
            extract = extract.substring(0, 500) + "...";
          }


          const articleURL =
            page.fullurl ||
            "https://en.wikipedia.org/wiki/" +
            encodeURIComponent(title.replace(/ /g, "_"));


          const resultHTML = document.createElement("div");

          resultHTML.className = "result";


          resultHTML.innerHTML = `
            <h2>${escapeHTML(title)}</h2>

            <p>
              ${escapeHTML(extract)}
            </p>

            <a
              class="source"
              href="${articleURL}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Read source ↗
            </a>
          `;


          results.appendChild(resultHTML);

        });


      } catch (error) {

        results.innerHTML = `
          <div class="result">
            <h2>Something went wrong</h2>

            <p>
              Factsack couldn't connect to the search service.
              Please check your internet connection and try again.
            </p>
          </div>
        `;

      }

    }


    function escapeHTML(text) {

      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

  </script>

</body>
  </html>
