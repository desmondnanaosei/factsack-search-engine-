<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack AI</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0b0f14;
  color: white;
  height: 100vh;
  overflow: hidden;
}

/* SIDEBAR */

.sidebar {
  width: 250px;
  height: 100vh;
  background: #11161e;
  position: fixed;
  left: 0;
  top: 0;
  padding: 15px;
  display: flex;
  flex-direction: column;
  border-right: 1px solid #222b36;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  padding: 15px 10px;
}

.new-chat {
  width: 100%;
  padding: 13px;
  border: 1px solid #303b4a;
  border-radius: 10px;
  background: #19212c;
  color: white;
  cursor: pointer;
  font-size: 15px;
  margin-top: 15px;
}

.new-chat:hover {
  background: #222c38;
}

.sidebar-bottom {
  margin-top: auto;
  color: #7d8795;
  font-size: 13px;
  padding: 10px;
}

/* MAIN */

.main {
  margin-left: 250px;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 25px;
  font-size: 18px;
  font-weight: bold;
  border-bottom: 1px solid #222b36;
  background: #0b0f14;
}

/* CHAT */

.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 30px 15%;
  padding-bottom: 120px;
}

.welcome {
  text-align: center;
  margin-top: 100px;
}

.welcome h1 {
  font-size: 42px;
  margin-bottom: 15px;
}

.welcome p {
  color: #8993a3;
  font-size: 17px;
}

.suggestions {
  margin-top: 35px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.suggestion {
  background: #11161e;
  border: 1px solid #293241;
  color: #c3cad4;
  padding: 12px 16px;
  border-radius: 12px;
  cursor: pointer;
}

.suggestion:hover {
  background: #19212c;
}

/* MESSAGES */

.message-row {
  display: flex;
  margin: 25px 0;
}

.message {
  max-width: 85%;
  padding: 17px 20px;
  border-radius: 16px;
  line-height: 1.7;
  font-size: 16px;
}

.user-message {
  background: #27324a;
  margin-left: auto;
}

.ai-message {
  background: #11161e;
  border: 1px solid #293241;
}

.ai-name {
  font-weight: bold;
  margin-bottom: 10px;
  font-size: 17px;
}

/* INPUT */

.input-area {
  position: fixed;
  bottom: 0;
  left: 250px;
  right: 0;
  background: #0b0f14;
  padding: 18px 15%;
}

.input-box {
  display: flex;
  align-items: center;
  background: #11161e;
  border: 1px solid #303b4a;
  border-radius: 18px;
  padding: 7px;
}

#userInput {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 13px;
  font-size: 16px;
}

#userInput::placeholder {
  color: #7d8795;
}

#sendButton {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 13px;
  background: #6577ff;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

#sendButton:hover {
  opacity: 0.85;
}

/* MOBILE */

@media (max-width: 700px) {

  .sidebar {
    width: 65px;
    padding: 8px;
  }

  .logo {
    font-size: 0;
    text-align: center;
  }

  .logo::after {
    content: "👑";
    font-size: 27px;
  }

  .new-chat {
    font-size: 0;
    padding: 12px;
  }

  .new-chat::after {
    content: "+";
    font-size: 25px;
  }

  .sidebar-bottom {
    display: none;
  }

  .main {
    margin-left: 65px;
  }

  .topbar {
    padding-left: 20px;
  }

  .chat-container {
    padding: 25px 15px;
    padding-bottom: 120px;
  }

  .input-area {
    left: 65px;
    padding: 12px;
  }

  .welcome {
    margin-top: 70px;
  }

  .welcome h1 {
    font-size: 32px;
  }

  .message {
    max-width: 92%;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div class="logo">
    👑 Factsack
  </div>

  <button class="new-chat" onclick="newChat()">
    + New Chat
  </button>

  <div class="sidebar-bottom">
    🤖 Factsack AI<br><br>
    Version 3.2
  </div>

</div>


<!-- MAIN -->

<div class="main">

  <div class="topbar">
    🤖 Factsack AI
  </div>


  <!-- CHAT -->

  <div class="chat-container" id="chat">

    <div class="welcome" id="welcome">

      <h1>How can I help you?</h1>

      <p>
        Ask Factsack anything.
      </p>


      <div class="suggestions">

        <button
        class="suggestion"
        onclick="quickMessage('Hi')">
          👋 Say Hi
        </button>


        <button
        class="suggestion"
        onclick="quickMessage('What is photosynthesis?')">
          🌱 Photosynthesis
        </button>


        <button
        class="suggestion"
        onclick="quickMessage('Who created you?')">
          👑 Who created you?
        </button>

      </div>

    </div>

  </div>

</div>


<!-- INPUT -->

<div class="input-area">

  <div class="input-box">

    <input
      type="text"
      id="userInput"
      placeholder="Message Factsack..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="sendMessage()">
      ↑
    </button>

  </div>

</div>


<script>


function escapeHTML(text) {

  return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


async function sendMessage() {

  const input =
    document.getElementById("userInput");

  const chat =
    document.getElementById("chat");

  const welcome =
    document.getElementById("welcome");


  const message =
    input.value.trim();


  if (message === "") {
    return;
  }


  if (welcome) {
    welcome.style.display = "none";
  }


  /* USER MESSAGE */

  const userRow =
    document.createElement("div");

  userRow.className =
    "message-row";


  userRow.innerHTML = `
    <div class="message user-message">
      ${escapeHTML(message)}
    </div>
  `;


  chat.appendChild(userRow);


  input.value = "";


  chat.scrollTop =
    chat.scrollHeight;


  /* AI THINKING */

  const aiRow =
    document.createElement("div");

  aiRow.className =
    "message-row";


  aiRow.innerHTML = `
    <div class="message ai-message">

      <div class="ai-name">
        🤖 Factsack AI
      </div>

      <div class="ai-text">
        Thinking...
      </div>

    </div>
  `;


  chat.appendChild(aiRow);


  chat.scrollTop =
    chat.scrollHeight;


  const aiText =
    aiRow.querySelector(".ai-text");


  const question =
    message.toLowerCase().trim();


  /* GREETINGS */

  if (
    question === "hi" ||
    question === "hello" ||
    question === "hey" ||
    question === "hi factsack"
  ) {

    aiText.textContent =
      "Hi! 👋 I'm Factsack AI. How can I help you today?";

    return;

  }


  /* HOW ARE YOU */

  if (
    question === "how are you" ||
    question === "how are u"
  ) {

    aiText.textContent =
      "I'm doing great! 🤖 Thanks for asking. What would you like to know?";

    return;

  }


  /* WHO CREATED YOU */

  if (

    question.includes("who created you") ||

    question.includes("who made you") ||

    question.includes("who created u") ||

    question.includes("who made u") ||

    question.includes("your creator")

  ) {

    aiText.textContent =
      "I was created by Desmond Nana Osei, a JHS graduate and developer. 👑";

    return;

  }


  /* WHAT IS YOUR NAME */

  if (

    question.includes("what is your name") ||

    question.includes("what's your name") ||

    question.includes("who are you")

  ) {

    aiText.textContent =
      "I'm Factsack AI 🤖, an AI-powered answer and search assistant created to help you find information quickly.";

    return;

  }


  /* THANK YOU */

  if (

    question === "thanks" ||

    question === "thank you" ||

    question === "thx"

  ) {

    aiText.textContent =
      "You're welcome! 👋 I'm always here to help.";

    return;

  }


  /* GOODBYE */

  if (

    question === "bye" ||

    question === "goodbye" ||

    question === "bye factsack"

  ) {

    aiText.textContent =
      "Goodbye! 👋 Come back anytime you need help.";

    return;

  }


  /* WIKIPEDIA ANSWER */

  try {

    aiText.textContent =
      "Finding the best answer...";


    const searchURL =

      "https://en.wikipedia.org/w/api.php" +

      "?action=query" +

      "&list=search" +

      "&srsearch=" +

      encodeURIComponent(message) +

      "&srlimit=1" +

      "&format=json" +

      "&origin=*";


    const response =
      await fetch(searchURL);


    const data =
      await response.json();


    if (

      !data.query ||

      !data.query.search ||

      data.query.search.length === 0

    ) {

      aiText.textContent =
        "Sorry, I couldn't find a direct answer for that.";

      return;

    }


    const title =
      data.query.search[0].title;


    const summaryURL =

      "https://en.wikipedia.org/api/rest_v1/page/summary/" +

      encodeURIComponent(title);


    const summaryResponse =
      await fetch(summaryURL);


    const summaryData =
      await summaryResponse.json();


    if (

      summaryData.extract

    ) {

      aiText.textContent =
        summaryData.extract;

    } else {

      aiText.textContent =
        "Sorry, I couldn't find a clear answer.";

    }


  } catch (error) {

    aiText.textContent =
      "Sorry, I couldn't find an answer right now. Please check your internet connection and try again.";

  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* ENTER KEY */

document
  .getElementById("userInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        sendMessage();

      }

    }
  );


/* QUICK MESSAGE */

function quickMessage(message) {

  const input =
    document.getElementById("userInput");


  input.value =
    message;


  sendMessage();

}


/* NEW CHAT */

function newChat() {

  const chat =
    document.getElementById("chat");


  chat.innerHTML = `

    <div
    class="welcome"
    id="welcome">

      <h1>
        How can I help you?
      </h1>

      <p>
        Ask Factsack anything.
      </p>


      <div class="suggestions">

        <button
        class="suggestion"
        onclick="quickMessage('Hi')">
          👋 Say Hi
        </button>


        <button
        class="suggestion"
        onclick="quickMessage('What is photosynthesis?')">
          🌱 Photosynthesis
        </button>


        <button
        class="suggestion"
        onclick="quickMessage('Who created you?')">
          👑 Who created you?
        </button>

      </div>

    </div>

  `;


  document
    .getElementById("userInput")
    .focus();

}


</script>

</body>
</html>
