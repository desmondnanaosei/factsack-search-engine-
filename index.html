<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack 3.3</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #080b10;
  color: white;
  min-height: 100vh;
}

.topbar {
  padding: 20px 25px;
  font-size: 22px;
  font-weight: bold;
}

.main {
  max-width: 900px;
  margin: auto;
  padding: 45px 20px;
  text-align: center;
}

.crown {
  font-size: 50px;
}

h1 {
  font-size: 52px;
  margin: 10px 0;
}

.description {
  color: #8993a3;
  margin-bottom: 30px;
}

.search-box {
  display: flex;
  background: #11161e;
  border: 1px solid #293241;
  border-radius: 18px;
  padding: 7px 7px 7px 18px;
}

#searchInput {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 16px;
  padding: 13px;
}

#searchButton {
  border: none;
  background: #6577ff;
  color: white;
  padding: 0 22px;
  border-radius: 13px;
  cursor: pointer;
  font-weight: bold;
}

.tabs {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 22px;
}

.tab {
  padding: 10px 15px;
  border-radius: 20px;
  border: 1px solid #293241;
  background: #11161e;
  color: #9ca6b5;
  cursor: pointer;
}

.tab.active {
  background: #182035;
  border-color: #6577ff;
  color: white;
}

#results {
  margin-top: 40px;
  text-align: left;
}

.result {
  background: #11161e;
  border: 1px solid #293241;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 15px;
}

.result h2 {
  margin-bottom: 10px;
  font-size: 20px;
}

.result p {
  color: #c3cad4;
  line-height: 1.6;
}

.user-question {
  background: #182035;
  border-color: #39446b;
}

.ai-answer h2 {
  color: #aeb8ff;
}

.source {
  display: inline-block;
  margin-top: 12px;
  color: #8291ff;
}

.status {
  text-align: center;
  color: #8993a3;
  padding: 30px;
}

@media (max-width: 600px) {
  h1 {
    font-size: 40px;
  }

  .main {
    padding: 30px 15px;
  }

  #searchButton {
    padding: 0 14px;
  }
}
</style>
</head>

<div class="topbar">
  👑 Factsack
</div>

<main class="main">

  <h1>Factsack</h1>
