<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: white;
  min-height: 100vh;
}

/* HEADER */

header {
  padding: 25px;
  display: flex;
  justify-content: center;
}

/* LOGO */

.logo {
  font-size: 32px;
  font-weight: bold;
  position: relative;
  letter-spacing: 1px;
}

.crown {
  color: #f5c542;
  font-size: 20px;
  position: absolute;
  top: -18px;
  left: 1px;
}

.f-letter {
  color: #4f8cff;
}

.rest-logo {
  color: white;
}

/* MAIN */

main {
  max-width: 850px;
  margin: 80px auto;
  padding: 20px;
}

.hero {
  text-align: center;
}

.hero h1 {
  font-size: 55px;
  margin-bottom: 12px;
}

.hero p {
  color: #9ca3af;
  font-size: 18px;
  margin-bottom: 40px;
}

/* SEARCH */

.search-box {
  display: flex;
  background: #151b2b;
  border: 1px solid #283044;
  border-radius: 16px;
  padding: 6px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.search-box:focus-within {
  border-color: #4f8cff;
}

.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  padding: 16px;
  font-size: 17px;
  color: white;
}

.search-box input::placeholder {
  color: #737b8c;
}

.search-btn {
  border: none;
  border-radius: 12px;
  background: #4f8cff;
  color: white;
  padding: 0 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.search-btn:hover {
  background: #3979e6;
}

/* QUICK BUTTONS */

.quick-searches {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.quick-searches button {
  background: #151b2b;
  border: 1px solid #283044;
  color: #cbd5e1;
  padding: 10px 17px;
  border-radius: 25px;
  cursor: pointer;
}

.quick-searches button:hover {
  border-color: #4f8cff;
  color: white;
}

/* ANSWER */

#answer {
  margin-top: 45px;
}

.answer-box {
  background: #151b2b;
  border: 1px solid #283044;
  border-radius: 20px;
  padding: 28px;
  animation: appear 0.3s ease;
}

.answer-title {
  color: #4f8cff;
  font-size: 22px;
  margin-bottom: 18px;
}

.answer-box h2 {
  margin-top: 0;
  font-size: 25px;
}

.answer-box p {
  color: #d1d5db;
  font-size: 17px;
  line-height: 1.8;
}

/* LOADING */

.loading {
  text-align: center;
  color: #9ca3af;
  font-size: 17px;
  padding: 35px;
}

/* ERROR */

.error {
  text-align: center;
  background: #2a1820;
  border: 1px solid #5c2835;
  color: #ff9cac;
  padding: 25px;
  border-radius: 15px;
}

/* FOOTER */

footer {
  text-align: center;
  color: #626b7c;
  padding: 40px;
}

/* ANIMATION */

@keyframes appear {

  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* MOBILE */

@media (max-width: 600px) {

  .hero h1 {
    font-size: 42px;
  }

  main {
    margin: 40px auto;
  }

  .search-box {
    border-radius: 14px;
  }

  .search-btn {
    padding: 0 16px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">

    <span class="crown">👑</span>

    <span class="f-letter">F</span><span class="rest-logo">actsack</span>

  </div>

</header>


<main>

<div class="hero">

<h1>Factsack</h1>

<p>
Search. Discover. Learn.
</p>


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Ask anything..."
>

<button
class="search-btn"
onclick="searchFactsack()"
>
Search
</button>

</div>


<div class="quick-searches">

<button onclick="quickSearch('Ghana')">
🇬🇭 Ghana
</button>

<button onclick="quickSearch('Science')">
🔬 Science
</button>

<button onclick="quickSearch('Space')">
🚀 Space
</button>

<button onclick="quickSearch('History')">
📚 History
</button>

</div>

</div>


<div id="answer"></div>

</main>


<footer>
Factsack © 2026
</footer>


<script>

/* ENTER SEARCH */

document
.getElementById("searchInput")
.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {
    searchFactsack();
  }

});


/* SEARCH */

async function searchFactsack() {

  const query =
  document
  .getElementById("searchInput")
  .value
  .trim();


  const answerBox =
  document
  .getElementById("answer");


  if (!query) return;


  answerBox.innerHTML = `

  <div class="loading">

  🔎 Finding your answer...

  </div>

  `;


  try {


    /* SEARCH WIKIPEDIA */

    const searchURL =

    "https://en.wikipedia.org/w/api.php" +

    "?action=query" +

    "&list=search" +

    "&srsearch=" +

    encodeURIComponent(query) +

    "&format=json" +

    "&origin=*";


    const searchResponse =
    await fetch(searchURL);


    const searchData =
    await searchResponse.json();


    const results =
    searchData.query.search;


    if (!results.length) {

      answerBox.innerHTML = `

      <div class="error">

      No answer found.

      </div>

      `;

      return;

    }


    /* BEST RESULT */

    const title =
    results[0].title;


    /* GET DIRECT SUMMARY */

    const summaryURL =

    "https://en.wikipedia.org/api/rest_v1/page/summary/" +

    encodeURIComponent(title);


    const summaryResponse =
    await fetch(summaryURL);


    const summaryData =
    await summaryResponse.json();


    const description =

    summaryData.extract ||

    "No detailed answer found.";


    /* SHOW ANSWER */

    answerBox.innerHTML = `

    <div class="answer-box">

    <div class="answer-title">

    📖 Factsack Answer

    </div>


    <h2>

    ${escapeHTML(title)}

    </h2>


    <p>

    ${escapeHTML(description)}

    </p>

    </div>

    `;


  }

  catch (error) {

    answerBox.innerHTML = `

    <div class="error">

    ❌ Couldn't find an answer.

    <br><br>

    Please try again.

    </div>

    `;

  }

}


/* QUICK SEARCH */

function quickSearch(query) {

  document
  .getElementById("searchInput")
  .value = query;


  searchFactsack();

}


/* SAFE TEXT */

function escapeHTML(text) {

  const div =
  document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
  </html>
