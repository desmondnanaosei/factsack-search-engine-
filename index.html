      <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Factsack — Search for Knowledge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #202124;
      transition: 0.3s;
    }

    /* NAVBAR */
    .navbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      font-size: 20px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-button {
      border: none;
      background: transparent;
      padding: 10px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-button:hover {
      background: #f1f3f4;
    }

    /* HOME */
    .home {
      min-height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 20px 50px;
    }

    .brand {
      font-size: 70px;
      font-weight: 800;
      letter-spacing: -4px;
      margin: 0;
    }

    .tagline {
      margin: 12px 0 32px;
      color: #5f6368;
      font-size: 17px;
    }

    /* SEARCH */
    .search-area {
      width: 100%;
      max-width: 680px;
    }

    .search-box {
      width: 100%;
      height: 58px;
      display: flex;
      align-items: center;
      border: 1px solid #dfe1e5;
      border-radius: 30px;
      padding: 0 8px 0 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: 0.2s;
      background: white;
    }

    .search-box:focus-within {
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .search-icon {
      font-size: 20px;
      margin-right: 12px;
    }

    #searchInput {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      font-size: 17px;
      background: transparent;
    }

    .search-button {
      border: none;
      border-radius: 25px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #202124;
      color: white;
      transition: 0.2s;
    }

    .search-button:hover {
      transform: scale(1.03);
    }

    /* SUGGESTIONS */
    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .suggestion {
      border: 1px solid #e0e0e0;
      background: #f8f9fa;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .suggestion:hover {
      background: #eeeeee;
      transform: translateY(-1px);
    }

    /* RESULTS */
    #results {
      width: 100%;
      max-width: 850px;
      margin: 55px auto 0;
      text-align: left;
    }

    .results-heading {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .result {
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
      transition: 0.2s;
    }

    .result:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .result a {
      color: #1a0dab;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
    }

    .result a:hover {
      text-decoration: underline;
    }

    .result p {
      color: #4d5156;
      line-height: 1.6;
      margin-bottom: 0;
    }

    .message {
      text-align: center;
      color: #5f6368;
      padding: 25px;
    }

    /* FOOTER */
    footer {
      margin-top: 70px;
      padding: 25px;
      color: #777;
      font-size: 13px;
      text-align: center;
    }

    /* DARK MODE */
    body.dark {
      background: #101114;
      color: #f1f3f4;
    }

    body.dark .tagline,
    body.dark .message {
      color: #b8bbc0;
    }

    body.dark .search-box {
      background: #1b1c20;
      border-color: #3a3b40;
    }

    body.dark #searchInput {
      color: white;
    }

    body.dark .suggestion {
      background: #1b1c20;
      color: white;
      border-color: #3a3b40;
    }

    body.dark .suggestion:hover {
      background: #292a2f;
    }

    body.dark .result {
      background: #1b1c20;
      border-color: #33353a;
    }

    body.dark .result p {
      color: #c7c9ce;
    }

    body.dark .nav-button {
      color: white;
    }

    body.dark .nav-button:hover {
      background: #292a2f;
    }

    body.dark .search-button {
      background: white;
      color: #202124;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      .navbar {
        padding: 0 18px;
      }

      .brand {
        font-size: 55px;
      }

      .home {
        padding-top: 75px;
      }

      .tagline {
        font-size: 15px;
        text-align: center;
      }

      .search-box {
        height: 54px;
      }

      #searchInput {
        font-size: 15px;
      }

      .search-button {
        padding: 11px 15px;
      }

      .suggestions {
        padding: 0 10px;
      }

      #results {
        margin-top: 40px;
      }

      .result {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      Factsack 🔎
    </div>

    <div class="nav-right">
      <button class="nav-button" onclick="toggleDarkMode()">
        🌙
      </button>
    </div>

  </nav>


  <!-- MAIN -->
  <main class="home">

    <h1 class="brand">
      Factsack
    </h1>

    <p class="tagline">
      Search the world. Discover knowledge.
    </p>


    <!-- SEARCH -->
    <div class="search-area">

      <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
          type="text"
          id="searchInput"
          placeholder="Search Factsack..."
          autocomplete="off"
        >

        <button
          class="search-button"
          onclick="searchFactsack()"
        >
          Search
        </button>

      </div>


      <!-- SUGGESTIONS -->
      <div class="suggestions">

        <button
          class="suggestion"
          onclick="quickSearch('Ghana')"
        >
          🇬🇭 Ghana
        </button>

        <button
          class="suggestion"
          onclick="quickSearch('Science')"
        >
          🔬 Science
        </button>

        <button
          class="suggestion"
          onclick="quickSearch('Space')"
        >
          🚀 Space
        </button>

        <button
          class="suggestion"
          onclick="quickSearch('History')"
        >
          📚 History
        </button>

      </div>

    </div>


    <!-- RESULTS -->
    <div id="results"></div>


    <footer>
      Factsack • Search for Knowledge
    </footer>

  </main>


  <script>

    /* SEARCH FUNCTION */

    async function searchFactsack() {

      const query =
        document.getElementById("searchInput").value.trim();

      const results =
        document.getElementById("results");


      if (!query) {

        results.innerHTML =
          "<div class='message'>Please enter something to search 🔎</div>";

        return;
      }


      results.innerHTML =
        "<div class='message'>🔎 Searching Factsack...</div>";


      try {

        const url =
          "https://en.wikipedia.org/w/api.php?" +
          "action=query" +
          "&list=search" +
          "&srsearch=" +
          encodeURIComponent(query) +
          "&format=json" +
          "&origin=*";


        const response =
          await fetch(url);


        if (!response.ok) {
          throw new Error("Network error");
        }


        const data =
          await response.json();


        const searches =
          data.query.search;


        if (searches.length === 0) {

          results.innerHTML =
            "<div class='message'>No results found for <b>" +
            query +
            "</b>.</div>";

          return;
        }


        results.innerHTML =
          "<div class='results-heading'>" +
          "Results for <b>" +
          escapeHTML(query) +
          "</b>" +
          "</div>";


        searches.forEach(function(item) {

          const title =
            item.title;


          const snippet =
            item.snippet
              .replace(/<[^>]*>/g, "");


          const link =
            "https://en.wikipedia.org/wiki/" +
            encodeURIComponent(
              title.replace(/ /g, "_")
            );


          results.innerHTML +=

            "<div class='result'>" +

            "<a href='" +
            link +
            "' target='_blank' rel='noopener noreferrer'>" +
            escapeHTML(title) +
            "</a>" +

            "<p>" +
            escapeHTML(snippet) +
            "</p>" +

            "</div>";

        });


        /* Scroll to results */

        document.getElementById("results")
          .scrollIntoView({
            behavior: "smooth",
            block: "start"
          });


      } catch (error) {

        console.error(error);

        results.innerHTML =
          "<div class='message'>" +
          "❌ Search failed. Please check your internet connection and try again." +
          "</div>";

      }

    }


    /* QUICK SEARCH */

    function quickSearch(text) {

      document.getElementById("searchInput").value = text;

      searchFactsack();

    }


    /* ENTER KEY */

    document
      .getElementById("searchInput")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {

          searchFactsack();

        }

      });


    /* DARK MODE */

    function toggleDarkMode() {

      document.body.classList.toggle("dark");

      const isDark =
        document.body.classList.contains("dark");

      localStorage.setItem(
        "factsackDarkMode",
        isDark ? "true" : "false"
      );

    }


    /* REMEMBER DARK MODE */

    if (
      localStorage.getItem("factsackDarkMode") === "true"
    ) {

      document.body.classList.add("dark");

    }


    /* SECURITY */

    function escapeHTML(text) {

      const div =
        document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
  </html>
