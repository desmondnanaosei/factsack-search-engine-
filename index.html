<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #090e16;
  color: white;
  min-height: 100vh;
}

.topbar {
  padding: 22px;
  font-size: 26px;
  font-weight: bold;
}

.main {
  max-width: 900px;
  margin: auto;
  padding: 20px;
  text-align: center;
}

.crown {
  font-size: 55px;
  margin-top: 15px;
}

h1 {
  font-size: 50px;
  margin-top: 10px;
}

.description {
  color: #9aa4b5;
  font-size: 20px;
  margin-top: 10px;
}

.search-container {
  max-width: 750px;
  margin: 35px auto 0;
}

.search-box {
  display: flex;
  background: #121925;
  border: 1px solid #293545;
  border-radius: 20px;
  padding: 7px;
  align-items: center;
}

.search-icon {
  padding-left: 10px;
}

#searchInput {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 14px;
  font-size: 16px;
}

#searchButton {
  background: #6577ff;
  color: white;
  border: none;
  border-radius: 14px;
  padding: 13px 18px;
  cursor: pointer;
}

.tabs {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 25px;
}

.tab {
  background: #121925;
  color: #c8ced8;
  border: 1px solid #293545;
  padding: 14px 20px;
  border-radius: 30px;
  cursor: pointer;
  font-size: 16px;
}

.tab.active {
  background: #202a42;
  border-color: #6577ff;
  color: white;
}

.suggestions {
  margin-top: 25px;
}

.try-text {
  color: #9aa4b5;
  margin-bottom: 15px;
}

.suggestion-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.suggestion {
  background: #121925;
  color: #c8ced8;
  border: 1px solid #293545;
  padding: 12px 17px;
  border-radius: 25px;
  cursor: pointer;
}

#results {
  max-width: 850px;
  margin: 35px auto;
  text-align: left;
}

.status {
  text-align: center;
  color: #9aa4b5;
  padding: 30px;
}

.message-row {
  display: flex;
  margin-bottom: 18px;
}

.message {
  max-width: 85%;
  padding: 20px;
  border-radius: 20px;
  border: 1px solid #293545;
}

.user-message {
  margin-left: auto;
  background: #293550;
}

.ai-message {
  background: #141b27;
}

.message-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 12px;
}

.message-text {
  color: #c8ced8;
  line-height: 1.7;
  font-size: 17px;
}

.new-chat {
  background: transparent;
  color: white;
  border: 1px solid #39455a;
  padding: 10px 16px;
  border-radius: 20px;
  cursor: pointer;
  margin-bottom: 20px;
}

.result {
  background: #121925;
  border: 1px solid #293545;
  padding: 20px;
  border-radius: 18px;
  margin-bottom: 15px;
}

.result h2 {
  margin-bottom: 12px;
}

.result p {
  color: #c8ced8;
  line-height: 1.6;
}

.source {
  display: inline-block;
  margin-top: 15px;
  color: #9ba6ff;
}

@media(max-width:600px) {
  h1 {
    font-size: 42px;
  }

  .message {
    max-width: 92%;
  }

  .tab {
    padding: 12px 15px;
  }
}
</style>
</head>

<body>

<div class="topbar">👑 Factsack</div>

<div class="main">

<div class="crown">👑</div>

<h1>Factsack</h1>

<p class="description">Search. Ask. Discover.</p>

<div class="search-container">

<div class="search-box">

<span class="search-icon">🔍</span>

<input
id="searchInput"
type="text"
placeholder="Search or ask anything..."
>

<button id="searchButton">Search</button>

</div>

</div>

<div class="tabs">

<button class="tab active" data-mode="all">🔎 All</button>

<button class="tab" data-mode="ai">🤖 AI Mode</button>

<button class="tab" data-mode="images">🖼️ Images</button>

<button class="tab" data-mode="news">📰 News</button>

<button class="tab" data-mode="videos">🎥 Videos</button>

</div>

<div class="suggestions" id="suggestions">

<div class="try-text">Try asking:</div>

<div class="suggestion-buttons">

<button class="suggestion" data-question="Hi">👋 Hi</button>

<button class="suggestion" data-question="How are you?">😊 How are you?</button>

<button class="suggestion" data-question="What should I eat today?">🍛 What should I eat?</button>

<button class="suggestion" data-question="What is photosynthesis?">🌱 Photosynthesis</button>

</div>

</div>

<div id="results">

<div class="status">
Welcome to Factsack 👑 Search or tap AI Mode to start chatting.
</div>

</div>

</div>
