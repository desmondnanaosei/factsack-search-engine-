<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factsack</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
  color: #222;
}

body.dark {
  background: #121212;
  color: white;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #4285f4;
}

.dark-btn {
  border: none;
  border-radius: 50%;
  padding: 12px;
  font-size: 18px;
  cursor: pointer;
}

main {
  max-width: 800px;
  margin: 60px auto;
  padding: 20px;
}

.hero {
  text-align: center;
}

h1 {
  font-size: 48px;
  margin-bottom: 10px;
}

.subtitle {
  color: gray;
  margin-bottom: 30px;
}

.search-box {
  display: flex;
  border: 1px solid #ccc;
  border-radius: 30px;
  overflow: hidden;
}

.search-box input {
  flex: 1;
  border: none;
  padding: 15px;
  font-size: 16px;
  outline: none;
}

.search-btn {
  border: none;
  padding: 15px 25px;
  background: #4285f4;
  color: white;
  cursor: pointer;
}

.quick-searches {
  margin-top: 20px;
}

.quick-searches button {
  margin: 5px;
  padding: 10px 15px;
  border: 1px solid #ccc;
  border-radius: 20px;
  background: white;
  cursor: pointer;
}

.answer-box {
  margin-top: 40px;
  padding: 25px;
  border-radius: 15px;
  background: #f5f8ff;
  border: 1px solid #d8e4ff;
}

.answer-box h2 {
  margin-top: 0;
  color: #4285f4;
}

.answer-box p {
  line-height: 1.7;
  font-size: 17px;
}

.loading {
  text-align: center;
  padding: 30px;
  font-size: 18px;
}

.error {
  text-align: center;
  padding: 30px;
  color: red;
}

body.dark .search-box input {
  background: #222;
  color: white;
}

body.dark .quick-searches button {
  background: #222;
  color: white;
  border-color: #555;
}

body.dark .answer-box {
  background: #1c2638;
  border-color: #334;
}

footer {
  text-align: center;
  padding: 30px;
  color: gray;
}

</style>
</head>

<body>

<header>

  <div class="logo">
    Factsack
  </div>

  <button class="dark-btn" onclick="toggleDarkMode()">
    🌙
  </button>

</header>


<main>

<div class="hero">

<h1>Factsack</h1>

<p class="subtitle">
Search. Discover. Learn.
</p>


<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Ask or search anything..."
>

<button
class="search-btn"
onclick="searchFactsack()"
>
Search
</button>

</div>


<div class="quick-searches">

<button onclick="quickSearch('Ghana')">
🇬🇭 Ghana
</button>

<button onclick="quickSearch('Science')">
🔬 Science
</button>

<button onclick="quickSearch('Space')">
🚀 Space
</button>

<button onclick="quickSearch('History')">
📚 History
</button>

</div>

</div>


<div id="answer"></div>

</main>


<footer>
Factsack © 2026
</footer>


<script>

/* SEARCH WITH ENTER */

document
.getElementById("searchInput")
.addEventListener("keydown", function(event) {

if (event.key === "Enter") {
searchFactsack();
}

});


/* MAIN SEARCH */

async function searchFactsack() {

const query =
document
.getElementById("searchInput")
.value
.trim();


const answerBox =
document
.getElementById("answer");


if (!query) {
return;
}


answerBox.innerHTML = `
<div class="loading">
🔎 Finding your answer...
</div>
`;


try {


/* SEARCH WIKIPEDIA */

const searchURL =
"https://en.wikipedia.org/w/api.php" +
"?action=query" +
"&list=search" +
"&srsearch=" +
encodeURIComponent(query) +
"&format=json" +
"&origin=*";


const searchResponse =
await fetch(searchURL);


const searchData =
await searchResponse.json();


const results =
searchData.query.search;


if (!results.length) {

answerBox.innerHTML = `
<div class="error">
No answer found.
</div>
`;

return;

}


/* GET BEST RESULT */

const title =
results[0].title;


/* GET SUMMARY */

const summaryURL =
"https://en.wikipedia.org/api/rest_v1/page/summary/" +
encodeURIComponent(title);


const summaryResponse =
await fetch(summaryURL);


const summaryData =
await summaryResponse.json();


const description =
summaryData.extract ||
summaryData.description ||
"No detailed answer found.";


/* SHOW ANSWER */

answerBox.innerHTML = `

<div class="answer-box">

<h2>
📖 ${escapeHTML(title)}
</h2>

<p>
${escapeHTML(description)}
</p>

</div>

`;


} catch (error) {


answerBox.innerHTML = `

<div class="error">

❌ Couldn't find an answer.

<br><br>

Please try again.

</div>

`;

}

}


/* QUICK SEARCH */

function quickSearch(query) {

document
.getElementById("searchInput")
.value = query;


searchFactsack();

}


/* DARK MODE */

function toggleDarkMode() {

document
.body
.classList
.toggle("dark");

}


/* SECURITY */

function escapeHTML(text) {

const div =
document.createElement("div");

div.textContent = text;

return div.innerHTML;

}

</script>

</body>
</html>
